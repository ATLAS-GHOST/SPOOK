global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'udp_receiver'
    scrape_interval: 5s
    static_configs:
      - targets: ['172.17.0.1:8000'] 
  
  - job_name: 'node'
    scrape_interval: 5s
    static_configs:
      - targets: ['172.17.0.1:9100'] 