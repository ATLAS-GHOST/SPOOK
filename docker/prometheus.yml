global:
  scrape_interval: 1s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'udp_receiver'
    scrape_interval: 5s
    static_configs:
      - targets: ['172.17.0.1:8000'] 
  
  - job_name: 'node'
    scrape_interval: 5s
    static_configs:
      - targets: ['172.17.0.1:9100'] 

  - job_name: "otel_metrics"
    scrape_interval: 1s
    static_configs:
      - targets: ["localhost:9464"]